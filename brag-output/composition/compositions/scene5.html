<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080c14;
        color: #f8fafc;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #080c14;
      }
      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        color: #ffffff;
        padding: 18px 44px;
        border-radius: 12px;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="scene5" data-width="1920" data-height="1080">
      <div id="s5-content" style="display: flex; flex-direction: column; align-items: center;">
        <div id="s5-logo" style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
          <div style="width: 76px; height: 76px; border-radius: 20px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(99, 102, 241, 0.6);">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="2" />
              <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
            </svg>
          </div>
          <span style="font-size: 68px; font-weight: 800; letter-spacing: -0.03em; color: #f8fafc;">OrbitPing</span>
        </div>

        <h2 id="s5-tagline" style="font-size: 36px; font-weight: 700; color: #cbd5e1; text-align: center; max-width: 850px; margin-bottom: 30px; line-height: 1.3;">
          Never let a silent background cron failure slip by.
        </h2>

        <div id="s5-points" style="display: flex; gap: 28px; margin-bottom: 36px; font-size: 18px; color: #94a3b8;">
          <span style="color: #f8fafc;">&check; 10 Free Checks</span>
          <span style="color: #f8fafc;">&check; Sub-200ms Ingestion</span>
          <span style="color: #f8fafc;">&check; Zero False Alarms</span>
          <span style="color: #f8fafc;">&check; Open-Source CLI</span>
        </div>

        <div id="s5-cta" class="cta-button" style="margin-bottom: 22px;">
          <span>Start Monitoring for Free</span>
          <span style="font-size: 20px; opacity: 0.85;">&rarr;</span>
        </div>

        <div id="s5-link" style="font-size: 18px; font-family: monospace; color: #818cf8; letter-spacing: 0.05em;">
          orbitping.io
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s5-logo", { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.05);
      tl.fromTo("#s5-tagline", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 0.3);
      tl.fromTo("#s5-points", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.45 }, 0.6);
      tl.fromTo("#s5-cta", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 0.9);
      tl.fromTo("#s5-link", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);

      // Hold through end
      tl.to("#s5-content", { opacity: 1, duration: 1.8 }, 1.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["scene5"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
