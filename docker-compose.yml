services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbitping_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://orbitping:orbitping_dev_password@db:5432/orbitping_dev?schema=public
      - DIRECT_URL=postgresql://orbitping:orbitping_dev_password@db:5432/orbitping_dev?schema=public
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: orbitping_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbitping
      POSTGRES_PASSWORD: orbitping_dev_password
      POSTGRES_DB: orbitping_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbitping -d orbitping_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: orbitping_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
